<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pay It 4Ward logo placeholder">
  <title>Pay It 4Ward</title>
  <defs>
    <linearGradient id="p4w-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17D4C0"/>
      <stop offset="1" stop-color="#C8FF3D"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="2" y="2" width="116" height="116" rx="30" fill="#0C1222"/>
  <rect x="7" y="7" width="106" height="106" rx="26" fill="url(#p4w-bg)"/>

  <!-- paddle -->
  <g transform="rotate(-18 60 60)">
    <rect x="41" y="70" width="11" height="26" rx="5.5" fill="#0C1222"/>
    <ellipse cx="46.5" cy="52" rx="24" ry="27" fill="#0C1222"/>
    <ellipse cx="46.5" cy="52" rx="18" ry="21" fill="none" stroke="#C8FF3D" stroke-width="2" stroke-dasharray="4 5" opacity=".65"/>
  </g>

  <!-- ball -->
  <g>
    <circle cx="84" cy="44" r="18" fill="#FF6B4A"/>
    <g fill="#0C1222" opacity=".55">
      <circle cx="78" cy="38" r="2.4"/>
      <circle cx="88" cy="37" r="2.4"/>
      <circle cx="73" cy="47" r="2.4"/>
      <circle cx="84" cy="46" r="2.4"/>
      <circle cx="92" cy="46" r="2.4"/>
      <circle cx="79" cy="54" r="2.4"/>
      <circle cx="89" cy="54" r="2.4"/>
    </g>
  </g>

  <!-- forward arrow = "4ward" -->
  <path d="M30 100 H84 M74 92 L84 100 L74 108" fill="none" stroke="#0C1222"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
